
name: Deploy ELEMENTAL REALMS Art Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Art Studio ZIP
        run: |
          mkdir extracted
          unzip -q Elemental_Realms_Art_Studio_Browser_Ready_v1.2.1.zip -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefix extracted/elemental-realms-art-studio

      - name: Build application
        run: npm run build --prefix extracted/elemental-realms-art-studio

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/elemental-realms-art-studio/dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
